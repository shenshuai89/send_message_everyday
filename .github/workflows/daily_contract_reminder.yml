name: Daily Contract Expiry Reminder

on:
  schedule:
    # 每天 UTC 时间 01:00 触发（对应北京时间 09:00）
    - cron: '32 2 * * *'
  # 允许手动触发用于测试
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run contract reminder script
        env:
          FEISHU_APP_ID:  ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:  ${{ secrets.FEISHU_APP_SECRET }}
          BITABLE_APP_TOKEN:  ${{ secrets.BITABLE_APP_TOKEN }}
          TABLE_ID:  ${{ secrets.TABLE_ID }}
          WECHAT_WEBHOOK_URL:  ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/send_reminder.py
